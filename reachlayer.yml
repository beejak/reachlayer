# Example Reachlayer configuration. Every field is optional - anything omitted (or this whole
# file being absent) falls back to the documented defaults. See docs/configuration.md for the
# full reference (PLAN.md §8 for the scoring formula).

scoring:
  cvssWeight: 0.5
  exploitWeight: 0.5
  reachableMultiplier: 1.0
  unreachableMultiplier: 0.4
  unknownMultiplier: 0.7
  internetFacingWeight: 0.15
  touchesAuthWeight: 0.1
  touchesPiiWeight: 0.1
  touchesSecretsWeight: 0.1
  blastRadiusCap: 1.5

advisor:
  # "noop" (templated, no API key needed) or "anthropic" (requires ANTHROPIC_API_KEY)
  provider: noop
  # Only the top-N ranked findings get a real LLM call; the rest use the templated fallback.
  topNForLlm: 5

output:
  topN: 5
  commentMarker: "<!-- reachlayer:report -->"

# Entry points EntryPointScanner's built-in discovery can't see on its own (main, Spring MVC
# handlers, direct HttpServlet subclass overrides) -- e.g. message-queue listeners, scheduled
# tasks, custom framework dispatch. Leave both lists empty (the default) if not needed.
entryPoints:
  # Any method carrying one of these annotations, on any class, is treated as an entry point.
  extraAnnotations: []
  #   - "org.springframework.scheduling.annotation.Scheduled"
  # Every public method declared directly on one of these classes is treated as an entry point.
  extraClasses: []
  #   - "com.example.jobs.NightlyReportJob"

# Display-only noise reduction (never suppression of data -- see docs/configuration.md). Every
# finding is still counted in the summary line, the SARIF output, and --metrics-out regardless of
# this section; it only hides matching CWEs from the rendered Markdown table(s).
suppression:
  # CWE id -> a required, human-readable reason. Leave empty (the default) if not needed.
  displayCwes: {}
  #   "CWE-563": "Team decision: unused-variable warnings are pure lint noise here (JIRA-1234)"
