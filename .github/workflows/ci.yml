name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and test
        run: ./gradlew build --no-daemon

  # Self-dogfooding: runs Reachlayer's own CLI against its synthetic fixtures and uploads the
  # resulting SARIF file through GitHub's real code-scanning ingestion (github/codeql-action/
  # upload-sarif). This is genuine external validation of output/sarif's SARIF mapping -- GitHub
  # accepting (or rejecting) the file is ground truth that no local schema reading can replace.
  # See docs/sarif-output.md.
  sarif-dogfood:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the CLI fat jar
        run: ./gradlew :cmd:shadowJar --no-daemon
      - name: Run the CLI against the synthetic fixtures, producing a SARIF report
        run: |
          java -jar cmd/build/libs/cmd-all.jar \
            --fortify fixtures/sample-fpr/audit.fvdl \
            --blackduck fixtures/sample-bdio/scan.json \
            --repo . \
            --post-pr-comment=false \
            --sarif-out reachlayer-dogfood.sarif
      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reachlayer-dogfood.sarif
          category: reachlayer-self-dogfood

  # The evaluation pipeline (see docs/evaluation-pipeline.md): generates a larger, varied synthetic
  # corpus (fixtures:corpus-generator) referencing fixtures:vulnerable-spring-app's real compiled
  # classes, runs the full CLI against it with real reachability analysis enabled, and uploads the
  # rendered report/SARIF/baseline/metrics as inspectable artifacts. Unlike sarif-dogfood (which
  # exercises the small, curated 5-finding fixture and uploads to this repo's own Security tab),
  # this corpus is ~100 findings and deliberately NOT uploaded to code scanning -- it's bulk
  # synthetic data, and uploading it would just add noise to the real Security tab for no benefit.
  evaluation:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the CLI fat jar and the fixture app's real bytecode
        run: ./gradlew :cmd:shadowJar :fixtures:vulnerable-spring-app:compileJava --no-daemon
      - name: Generate the larger synthetic evaluation corpus
        run: ./gradlew :fixtures:corpus-generator:run --args="build/evaluation-corpus 42 40 60" --no-daemon
      - name: Run the full pipeline against it, with real reachability analysis enabled
        run: |
          java -jar cmd/build/libs/cmd-all.jar \
            --fortify build/evaluation-corpus/audit.fvdl \
            --blackduck build/evaluation-corpus/scan.json \
            --repo . \
            --classes fixtures/vulnerable-spring-app/build/classes/java/main \
            --out build/evaluation-corpus/report.md \
            --sarif-out build/evaluation-corpus/report.sarif \
            --baseline-out build/evaluation-corpus/baseline.json \
            --metrics-out build/evaluation-corpus/metrics.json \
            --post-pr-comment=false
      - name: Print the pipeline metrics summary
        run: cat build/evaluation-corpus/metrics.json
      - name: Sanity-check genuine reachability signal was produced (not just UNKNOWN)
        run: |
          python3 - <<'PYEOF'
          import json, sys
          metrics = json.load(open("build/evaluation-corpus/metrics.json"))
          by_reach = metrics["findingCountsByReachability"]
          print("Reachability distribution:", by_reach)
          if by_reach.get("reachable", 0) < 1 or by_reach.get("unreachable", 0) < 1:
              print("FAIL: expected at least 1 reachable and 1 unreachable finding from the "
                    "fixture-class anchors -- reachability analysis may not be running correctly.")
              sys.exit(1)
          print("OK: genuine REACHABLE/UNREACHABLE signal confirmed.")
          PYEOF
      - name: Upload evaluation artifacts for inspection
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-corpus-results
          path: build/evaluation-corpus/
          retention-days: 14
