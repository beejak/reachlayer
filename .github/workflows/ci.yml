name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and test
        run: ./gradlew build --no-daemon

  # Self-dogfooding: runs Reachlayer's own CLI against its synthetic fixtures and uploads the
  # resulting SARIF file through GitHub's real code-scanning ingestion (github/codeql-action/
  # upload-sarif). This is genuine external validation of output/sarif's SARIF mapping -- GitHub
  # accepting (or rejecting) the file is ground truth that no local schema reading can replace.
  # See docs/sarif-output.md.
  sarif-dogfood:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the CLI fat jar
        run: ./gradlew :cmd:shadowJar --no-daemon
      - name: Run the CLI against the synthetic fixtures, producing a SARIF report
        run: |
          java -jar cmd/build/libs/cmd-all.jar \
            --fortify fixtures/sample-fpr/audit.fvdl \
            --blackduck fixtures/sample-bdio/scan.json \
            --repo . \
            --post-pr-comment=false \
            --sarif-out reachlayer-dogfood.sarif
      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reachlayer-dogfood.sarif
          category: reachlayer-self-dogfood
